<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" preserveAspectRatio="xMidYMin slice">
  <style>
    @keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(450px) rotate(540deg)}}
    @keyframes drift{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
    .drift{animation:drift 4s ease-in-out infinite}
    .fall{animation:fall 11s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <radialGradient id="a" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#ffe3ec"/><stop offset="1" stop-color="#f58fb2"/></radialGradient>
    <radialGradient id="b" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffc9dc"/></radialGradient>
    <radialGradient id="c" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#ffd0dd"/><stop offset="1" stop-color="#e2638f"/></radialGradient>
    <path id="petal" d="M0-8C5-6 7-1 5 3C3 7-1 8-3 6C-6 3-5-5 0-8Z"/>
  </defs>
  <g transform="translate(9 0)"><g class="drift" style="animation-duration:5.4s;animation-delay:-2.0s"><g class="fall" style="animation-duration:10.0s;animation-delay:-0.6s"><use href="#petal" transform="scale(0.83)" fill="url(#a)"/></g></g></g>
  <g transform="translate(33 0)"><g class="drift" style="animation-duration:3.7s;animation-delay:-0.3s"><g class="fall" style="animation-duration:8.4s;animation-delay:-3.6s"><use href="#petal" transform="scale(1.09)" fill="url(#a)"/></g></g></g>
