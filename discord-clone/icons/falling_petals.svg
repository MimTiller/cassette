  <g transform="translate(70 0)"><g class="drift" style="animation-duration:3.3s;animation-delay:-1.8s"><g class="fall" style="animation-duration:12.3s;animation-delay:-7.0s"><use href="#petal" transform="scale(1.00)" fill="url(#a)"/></g></g></g>
  <g transform="translate(96 0)"><g class="drift" style="animation-duration:5.1s;animation-delay:-1.9s"><g class="fall" style="animation-duration:8.9s;animation-delay:-4.9s"><use href="#petal" transform="scale(1.21)" fill="url(#a)"/></g></g></g>
  <g transform="translate(110 0)"><g class="drift" style="animation-duration:4.5s;animation-delay:-3.5s"><g class="fall" style="animation-duration:11.1s;animation-delay:-5.2s"><use href="#petal" transform="scale(1.15)" fill="url(#c)"/></g></g></g>
  <g transform="translate(137 0)"><g class="drift" style="animation-duration:4.0s;animation-delay:-0.3s"><g class="fall" style="animation-duration:9.2s;animation-delay:-2.8s"><use href="#petal" transform="scale(0.93)" fill="url(#a)"/></g></g></g>
  <g transform="translate(158 0)"><g class="drift" style="animation-duration:5.2s;animation-delay:-0.6s"><g class="fall" style="animation-duration:11.6s;animation-delay:-4.9s"><use href="#petal" transform="scale(1.00)" fill="url(#a)"/></g></g></g>
  <g transform="translate(184 0)"><g class="drift" style="animation-duration:4.0s;animation-delay:-3.0s"><g class="fall" style="animation-duration:12.7s;animation-delay:-7.3s"><use href="#petal" transform="scale(1.10)" fill="url(#a)"/></g></g></g>
  <g transform="translate(198 0)"><g class="drift" style="animation-duration:4.0s;animation-delay:-0.3s"><g class="fall" style="animation-duration:9.8s;animation-delay:-0.9s"><use href="#petal" transform="scale(1.15)" fill="url(#c)"/></g></g></g>
  <g transform="translate(218 0)"><g class="drift" style="animation-duration:4.3s;animation-delay:-2.8s"><g class="fall" style="animation-duration:11.3s;animation-delay:-11.2s"><use href="#petal" transform="scale(0.84)" fill="url(#b)"/></g></g></g>
  <g transform="translate(242 0)"><g class="drift" style="animation-duration:3.9s;animation-delay:-3.6s"><g class="fall" style="animation-duration:9.9s;animation-delay:-3.5s"><use href="#petal" transform="scale(1.27)" fill="url(#a)"/></g></g></g>
  <g transform="translate(265 0)"><g class="drift" style="animation-duration:3.5s;animation-delay:-2.6s"><g class="fall" style="animation-duration:8.3s;animation-delay:-3.3s"><use href="#petal" transform="scale(1.34)" fill="url(#a)"/></g></g></g>
  <g transform="translate(284 0)"><g class="drift" style="animation-duration:3.4s;animation-delay:-2.8s"><g class="fall" style="animation-duration:10.2s;animation-delay:-8.9s"><use href="#petal" transform="scale(1.18)" fill="url(#a)"/></g></g></g>
