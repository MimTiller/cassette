  <style>
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.2}}
    @keyframes glint{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.3);opacity:.3}}
    @keyframes shoot{0%{transform:translate(-60px,-30px);opacity:0}2%{opacity:1}12%,100%{transform:translate(300px,150px);opacity:0}}
    .t1{animation:twinkle 2.2s ease-in-out infinite}
    .t2{animation:twinkle 3.1s ease-in-out infinite}
    .t3{animation:twinkle 4.3s ease-in-out infinite}
    .glint{animation:glint 3s ease-in-out infinite}
    .shoot{animation:shoot 9s linear infinite}
