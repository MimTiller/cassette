[package]
name = "discord-clone"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

# Standalone scaffold living at the repo root — NOT a member of the
# parent workspace. An empty `[workspace]` table detaches it so cargo
# doesn't pull it in (same pattern as examples/fiddle/template) and so
# it keeps its own `target/`, which keeps per-compile invocations warm.
[workspace]

# The library half stays platform-agnostic — no `web.rs` / `ios.rs` /
# `android.rs`, no `#[cfg(target_os = "...")]` blocks, no `wasm-bindgen`
# / `backend-*` direct deps. Same source ships to every backend.
#
# The platform-specific half is `src/main.rs`: one `idealyst::entry!`
# line whose shell is picked by the target triple. The iOS / Android
# wrappers the CLI still generates at build time depend on this crate as
# an `rlib` and supply their own `staticlib` / `cdylib` crate-type.
[lib]
crate-type = ["rlib"]

# No `catalog` feature or catalog binary is needed for the MCP server:
# `idealyst mcp` generates an ephemeral wrapper crate on demand that turns
# on the `catalog` feature (and each component-library dependency's own
# `catalog` feature) across the whole graph and force-links those deps, so
# every `#[component]` plus dependency-provided catalog entries (icon sets,
# …) surface. See the `catalog_wrapper` module in the CLI.

[features]
# `sidecar`: enabled ONLY by the CLI-generated runtime-server sidecar
# wrapper (`idealyst dev`). Pulls `dev-server` so the recorder-side
# registration seams compile.
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only. It carries whatever
# the target needs — `backend-web` + the wasm-bindgen glue on wasm, a
# native shell otherwise — so this manifest names no backend directly
# and `cargo build` alone produces a runnable artifact.
idealyst = { path = "/root/idealyst-native/crates/idealyst" }
# The author surface. `runtime-core` is the crate this project aliases
# to `runtime_core` at its root (see src/lib.rs). `runtime-vocabulary` is
# needed because the `ui!` emission spells absolute
# `::runtime_vocabulary::glue::…` paths, and `runtime-scene` because
# `register_scene_extensions` is generic over the scene `Registry` host.
runtime-core = { path = "/root/idealyst-native/crates/runtime/core" }
runtime-vocabulary = { path = "/root/idealyst-native/crates/runtime/vocabulary" }
runtime-scene = { path = "/root/idealyst-native/crates/runtime/scene" }
# Wall-clock readings for message timestamps (`runtime_shared::time::epoch_millis`
# / `local_offset_minutes` — the web backend installs a `js Date`-backed source
# during bootstrap). Not re-exported at the `runtime_core` root, so the crate
# is depended on directly.
runtime-shared = { path = "/root/idealyst-native/crates/runtime/shared" }
# Recorder backend for the runtime-server sidecar wrapper. Optional —
# pulled in only by the `sidecar` feature (host-side sidecar build);
# never compiled for device/web targets.
dev-server = { path = "/root/idealyst-native/crates/dev/server", optional = true }
# The backend half of the full-stack pair. We depend on it with DEFAULT
# features (no `server`), so its `#[server]` fns — e.g. `auth::login` — compile
# here as typed RPC *stubs* that POST over the `server` SDK's transport. That
# is the client side of the same `#[server]` fn the backend serves; there is
# no manual HTTP in this crate. `serde` comes along transitively (the shared
# wire types are `Serialize`/`Deserialize`), so no direct serde dep is needed.
discord-server = { path = "/root/idealyst-native/discord-server" }
# The server-fn client SDK. `discord-clone` depends on it directly so it can
# call `server::configure(...)` at startup (pointing the RPC stubs at a base
# URL) and attach the signed-in user id as the `x-user-id` header via
# `server::credentials_from_fn`. `discord-server` also pulls it in transitively
# for its codegen'd stubs; the direct dep is for the `configure` call site.
server = { path = "/root/idealyst-native/crates/api/server" }

# No backend deps: `register_scene_extensions` is generic over the scene
# `Host` (this scaffold registers no third-party SDKs), so the app crate
# is fully platform-agnostic — the CLI-generated wrappers bring their own
# concrete backend. A project that adds an SDK with a backend-CONCRETE
# scene handler specializes `register_scene_extensions` to that backend's
# registry type and adds the matching backend dep then.

# Pin the wasm-bindgen family to exactly what the installed `wasm-bindgen-cli`
# (0.2.122, matching the parent repo's lockfile) produces. `idealyst build --web`
# fails with a schema-version mismatch (wasm 0.2.128 vs cli 0.2.122) otherwise.
# Declared as exact direct deps so the whole interlocked family (web-sys ->
# js-sys -> wasm-bindgen, plus wasm-bindgen-futures) resolves down together.
wasm-bindgen = "=0.2.122"
js-sys = "=0.3.99"
web-sys = "=0.3.99"
wasm-bindgen-futures = "=0.4.72"

# Web-only: `auth::configure_server` reads `window.location.origin` so the
# `#[server]` stubs call the API on the page's own origin.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.99", features = ["Window", "Location"] }

# Idealyst project config. The CLI reads this on `idealyst build`,
# `idealyst run`, `idealyst dev`, etc.
[package.metadata.idealyst.app]
name      = "Discord Clone"
bundle_id = "ai.truday.idealyst.discord_clone"
version   = "0.0.1"
# Platforms `idealyst dev` and `idealyst build` fan out across when
# no `--web` / `--ios` / `--android` flag is passed on the command
# line. We default to web-only because it's the broadest target with
# zero per-platform toolchain setup (no Xcode, no NDK) — a fresh
# clone of this project will `idealyst dev` straight into a hot-
# reloading browser preview. Add the mobile targets when you're
# ready: `targets = ["web", "ios", "android"]`. The `run ios` /
# `run android` subcommands work regardless of what's listed here
# (they take an explicit platform argument), so you can also just
# leave this alone and invoke them directly.
targets   = ["web"]
# Full-stack dev: `idealyst dev --web` builds + runs this backend beside the
# bundle and serves the UI and the /_srv API from one origin (the server
# serves the staged dist/web via WEB_DIST; see discord-server/src/bin/server.rs).
server_manifest = "../discord-server-run/Cargo.toml"
server_bin      = "server"
