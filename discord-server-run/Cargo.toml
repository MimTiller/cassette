# Thin standalone workspace so `idealyst dev --web` / `idealyst run server` can
# build + run the discord-server API+static binary: the CLI does not pass
# `--features server` for a `server_manifest`, so this package enables it via its
# dependency. The bin source is shared with `discord-server` (see [[bin]] path).
[package]
name = "discord-server-run"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
discord-server = { path = "../discord-server", features = ["server"] }
server = { path = "/root/idealyst-native/crates/api/server" }
axum = "0.7.9"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["fs"] }

[[bin]]
name = "server"
path = "../discord-server/src/bin/server.rs"
